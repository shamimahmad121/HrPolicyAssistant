<h2 mat-dialog-title>Version history — {{ policy.name }}</h2>

<mat-dialog-content>
  @if (loading()) {
    <div class="loading">
      <mat-spinner diameter="28"></mat-spinner>
    </div>
  } @else {
    <table mat-table [dataSource]="versions()" class="full-width">
      <ng-container matColumnDef="version">
        <th mat-header-cell *matHeaderCellDef>Version</th>
        <td mat-cell *matCellDef="let v">v{{ v.version }}</td>
      </ng-container>

      <ng-container matColumnDef="fileName">
        <th mat-header-cell *matHeaderCellDef>File</th>
        <td mat-cell *matCellDef="let v">
          <mat-icon inline="true">picture_as_pdf</mat-icon>
          {{ v.fileName }}
        </td>
      </ng-container>

      <ng-container matColumnDef="effectiveDate">
        <th mat-header-cell *matHeaderCellDef>Effective date</th>
        <td mat-cell *matCellDef="let v">{{ v.effectiveDate | date: 'mediumDate' }}</td>
      </ng-container>

      <ng-container matColumnDef="uploadedDate">
        <th mat-header-cell *matHeaderCellDef>Uploaded</th>
        <td mat-cell *matCellDef="let v">{{ v.uploadedDate | date: 'medium' }}</td>
      </ng-container>

      <ng-container matColumnDef="uploadedBy">
        <th mat-header-cell *matHeaderCellDef>Uploaded by</th>
        <td mat-cell *matCellDef="let v">{{ v.uploadedBy }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let v">
          <mat-chip class="status-chip" [class.active]="v.status === 'active'">{{ v.status }}</mat-chip>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
